name: getgems-flipper paper loop

# Hourly: scan Getgems listings vs fill-based references, log candidates, check outcomes of older ones,
# collect the Portals purchase feed. Results are committed back to the repo (data/*.jsonl, scan_dump.json).
# No wallet key here: this workflow only reads markets.

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch: {}

concurrency:
  group: paper-loop
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect Portals fills
        env:
          PORTALS_AUTH: ${{ secrets.PORTALS_AUTH }}
          PORTALS_COOKIE: ${{ secrets.PORTALS_COOKIE }}
        run: python3 portals_fills.py --once || echo "portals feed unavailable (token expired?)"
      - name: Scan and paper-trade
        env:
          GG_KEY: ${{ secrets.GG_KEY }}
          PORTALS_AUTH: ${{ secrets.PORTALS_AUTH }}
          PORTALS_COOKIE: ${{ secrets.PORTALS_COOKIE }}
        run: |
          python3 scan.py 20 | tee -a paper_runs.txt
          python3 paper.py log | tee -a paper_runs.txt
          python3 paper.py check | tee -a paper_runs.txt
      - name: Commit results
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add data/*.jsonl scan_dump.json paper_runs.txt
          git diff --cached --quiet || git commit -m "paper: $(date -u '+%F %H:%M') run"
          git pull --rebase -q || true
          git push
