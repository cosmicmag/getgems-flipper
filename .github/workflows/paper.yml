name: getgems-flipper paper loop

# Hourly: scan Getgems listings vs fill-based references, log candidates, check outcomes of older ones,
# collect the Portals purchase feed. Results are committed back to the repo (data/*.jsonl, scan_dump.json).
# No wallet key here: this workflow only reads markets.

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch: {}

concurrency:
  group: paper-loop
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install signer deps
        run: npm ci --prefix signer --silent
      - name: Collect Portals fills
        env:
          PORTALS_AUTH: ${{ secrets.PORTALS_AUTH }}
          PORTALS_COOKIE: ${{ secrets.PORTALS_COOKIE }}
        run: python3 portals_fills.py --once || echo "portals feed unavailable (token expired?)"
      - name: Scan and paper-trade
        env:
          GG_KEY: ${{ secrets.GG_KEY }}
          PORTALS_AUTH: ${{ secrets.PORTALS_AUTH }}
          PORTALS_COOKIE: ${{ secrets.PORTALS_COOKIE }}
          MNEMONIC: ${{ secrets.MNEMONIC }}     # needed to sign reprice transactions
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python3 scan.py 20 | tee -a paper_runs.txt
          python3 paper.py log | tee -a paper_runs.txt
          python3 paper.py check | tee -a paper_runs.txt
          python3 list_inventory.py --send | tee -a paper_runs.txt
          python3 sales.py | tee -a paper_runs.txt
          python3 reprice.py --send | tee -a paper_runs.txt
      - name: Commit results
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git config merge.union.driver true
          git add data/*.jsonl scan_dump.json paper_runs.txt
          git diff --cached --quiet && exit 0
          git commit -m "paper: $(date -u '+%F %H:%M') run"
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git rebase -X theirs origin/main || { git checkout --theirs . ; git add -A; GIT_EDITOR=true git rebase --continue || git rebase --abort; }
            git push -q && exit 0
            sleep $((i*7))
          done
          echo "push failed after retries"; exit 1
