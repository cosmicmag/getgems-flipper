name: getgems-flipper watcher

# Long-running loop job (tick every 10s), re-dispatched by itself before the timeout; concurrency keeps exactly
# one instance alive. Trades with the bot wallet (secret MNEMONIC) within the risk limits below.

on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch: {}

concurrency:
  group: watcher
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install signer deps
        run: npm ci --prefix signer --silent
      - name: Wallet check (fails fast if the seed secret is wrong)
        env:
          MNEMONIC: ${{ secrets.MNEMONIC }}
        run: cd signer && npx tsx send.ts --balance
      - name: Watch new listings and trade
        env:
          GG_KEY: ${{ secrets.GG_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
          MNEMONIC: ${{ secrets.MNEMONIC }}        # bot wallet seed; trading is capped by MAX_LOT_TON / DAILY_CAP_TON
          AUTO_BUY: "1"
          MAX_LOT_TON: "70"
          DAILY_CAP_TON: "150"
          WEEKLY_LOSS_STOP_TON: "30"
          MAX_SINGLE_TON: "80"
          TICK_SECONDS: "10"
          MAX_RUN_SEC: "20400"   # 5h40m, then exit so the re-dispatch step starts a fresh instance
        run: |
          git config user.name "watch-bot"
          git config user.email "watch-bot@users.noreply.github.com"
          python3 watch.py
      - name: Re-dispatch (GitHub drops scheduled runs; keep the loop alive ourselves)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run watch.yml || true
