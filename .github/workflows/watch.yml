name: getgems-flipper watcher

# Long-running loop job (tick every 20s) restarted hourly by the schedule; concurrency keeps exactly one
# instance alive. Reads the listings feed only; no wallet key, no trading.

on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch: {}

concurrency:
  group: watcher
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Watch new listings
        env:
          GG_KEY: ${{ secrets.GG_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
          TICK_SECONDS: "10"
          MAX_RUN_SEC: "20400"   # 5h40m, then exit so the re-dispatch step starts a fresh instance
        run: |
          git config user.name "watch-bot"
          git config user.email "watch-bot@users.noreply.github.com"
          python3 watch.py
      - name: Re-dispatch (GitHub drops scheduled runs; keep the loop alive ourselves)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run watch.yml || true
